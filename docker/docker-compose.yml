services:
  # ══════════════════════════════════════════════════════════════════════════════
  # Database Services (shared across all tests)
  # ══════════════════════════════════════════════════════════════════════════════
  
  # MariaDB — the MySQL-compatible server used for ALL MySQL connector tests.
  # The ORM's MySQL connector links MariaDB Connector/C (it needs the non-blocking
  # mysql_*_start/_cont API), so we target MariaDB, not Oracle MySQL. Host port 3307
  # (the coroutine probe / WSL scripts expect it there).
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: orm_test_password
      MARIADB_DATABASE: orm_test
      MARIADB_USER: orm_test
      MARIADB_PASSWORD: orm_test_password
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - orm-network

  postgresql:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - orm-network

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: test_password
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - orm-network

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orm-network

  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: test_cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - orm-network

  # ══════════════════════════════════════════════════════════════════════════════
  # Unit + MockDB Tests (no external DB required)
  # ══════════════════════════════════════════════════════════════════════════════

  test-unit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: unit-test
    networks:
      - orm-network

  # ══════════════════════════════════════════════════════════════════════════════
  # Per-Database Test Services
  # ══════════════════════════════════════════════════════════════════════════════

  test-postgresql:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: postgresql-test
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      ORM_POSTGRESQL_HOST: postgresql
      ORM_POSTGRESQL_PORT: 5432
      ORM_POSTGRESQL_USER: postgres
      ORM_POSTGRESQL_PASSWORD: test_password
      ORM_POSTGRESQL_DB: test_db
    networks:
      - orm-network

  test-mysql:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: mysql-test
    # Uses the MariaDB service: the live MySQL connector links MariaDB Connector/C,
    # and the mariadb image's healthcheck is reliable. (MySQL 8.0's caching_sha2
    # auth is awkward for the MariaDB client.)
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ORM_MYSQL_HOST: mariadb
      ORM_MYSQL_PORT: 3306
      ORM_MYSQL_USER: root
      ORM_MYSQL_PASSWORD: orm_test_password
      ORM_MYSQL_DATABASE: orm_test
    networks:
      - orm-network

  test-mongodb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: mongodb-test
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ORM_MONGODB_HOST: mongodb
      ORM_MONGODB_PORT: 27017
      ORM_MONGODB_USER: root
      ORM_MONGODB_PASSWORD: test_password
      ORM_MONGODB_DB: test_db
    networks:
      - orm-network

  test-redis:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: redis-test
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ORM_REDIS_HOST: redis
      ORM_REDIS_PORT: 6379
    networks:
      - orm-network

  test-cassandra:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: cassandra-test
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      ORM_CASSANDRA_HOST: cassandra
      ORM_CASSANDRA_PORT: 9042
    networks:
      - orm-network

  test-sqlite:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: sqlite-test
    # SQLite doesn't need external database service
    networks:
      - orm-network

  # ══════════════════════════════════════════════════════════════════════════════
  # Full Test Suite (All Drivers)
  # ══════════════════════════════════════════════════════════════════════════════

  test-all:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: all-test
    depends_on:
      mariadb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      ORM_MYSQL_HOST: mariadb
      ORM_MYSQL_PORT: 3306
      ORM_MYSQL_USER: root
      ORM_MYSQL_PASSWORD: orm_test_password
      ORM_MYSQL_DATABASE: orm_test
      ORM_POSTGRESQL_HOST: postgresql
      ORM_POSTGRESQL_PORT: 5432
      ORM_POSTGRESQL_USER: postgres
      ORM_POSTGRESQL_PASSWORD: test_password
      ORM_POSTGRESQL_DATABASE: test_db
      ORM_MONGODB_HOST: mongodb
      ORM_MONGODB_PORT: 27017
      ORM_MONGODB_USER: root
      ORM_MONGODB_PASSWORD: test_password
      ORM_MONGODB_DB: test_db
      ORM_REDIS_HOST: redis
      ORM_REDIS_PORT: 6379
      ORM_CASSANDRA_CONTACT_POINTS: cassandra
      ORM_CASSANDRA_PORT: 9042
    networks:
      - orm-network

networks:
  orm-network:
    driver: bridge
