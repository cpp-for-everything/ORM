# Host CI: compile the library and run unit / MockDB / SQLite tests on current
# GitHub-hosted runners. Live Cassandra/Mongo/MySQL/Neo4j/Postgres/Redis are
# not run here — they live in docker-tests.yml.
#
# ubuntu-24.04 does not ship GCC 15 (image has GCC 12/13/14). GCC jobs use the
# official `gcc:15` container on an ubuntu-24.04 runner so the compiler is 15+.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skipped-checks:
    name: Skipped checks (explicit)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Disclose skipped checks
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Skipped checks (not hidden)

          These are **not** run by this `ci` workflow. A skip is recorded here instead of a green badge.

          | Check | Why it is skipped |
          |-------|-------------------|
          | clang-tidy | No `.clang-tidy` in the repo. ubuntu-24.04 has `clang-tidy-18` matching Clang 18; enabling default checks as WarningsAsErrors would be a silent policy change. |
          | clang-format gate | `.clang-format` exists; `auto-clang-format.yml` auto-commits and is not called from this workflow. |
          | cppcheck / Doxygen / `deploy.yaml` | Template leftover (`upload-artifact@v1`, paths `example` / `lib/core`). Not called from this workflow. |
          | GitHub Pages (`gh-pages.yaml`) | Uploads `./reports`, which is not in git. Not called from this workflow. Repo-level "pages build and deployment" is a GitHub Pages setting (Jekyll); `.nojekyll` is added so Jekyll does not parse submodules. **Not claimed green until it runs on `main`.** |
          | Live Cassandra / Mongo / MySQL / Neo4j / Postgres / Redis | Host matrix does not start foreign DBs. See workflow `Docker Integration Tests`. |
          | Neo4j live suite in Docker | `docker/Dockerfile` `all-test` sets `ORM_ENABLE_NEO4J=OFF` (no libneo4j-client in the image). Disclosed again in that workflow. |
          | macOS | Clang 18 is covered on ubuntu-24.04; no extra macOS cell. |
          | `ENABLE_DEVELOPER_MODE` ON/OFF | Option does not exist in current CMake. |
          | Coverage / codecov | Not part of the compile+ctest bar. |
          | C++26 reflection path | Compilers in this matrix do not provide `__cpp_impl_reflection`; tests use the Boost.PFR path. |
          | Clang 18 **Release** (-O3) | Clang 18.1.3 ICE (frontend exit 139) on `test_mysql_connector.cpp` / `test_postgresql_connector.cpp` template instantiation. Cell runs **Debug** instead so ctest is reached. |
          EOF

  test-gcc15:
    name: ubuntu-24.04 GCC 15 ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: gcc:15
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Install CMake, Ninja, SQLite
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            git \
            libsqlite3-dev \
            ninja-build \
            pkg-config \
            python3
          git --version
          cmake --version
          ninja --version
          g++ --version

      - uses: actions/checkout@v4

      - name: Configure, build, ctest
        env:
          CC: gcc
          CXX: g++
        run: bash .github/scripts/ci-build.sh "${{ matrix.build_type }}"

      - name: Upload ctest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-ubuntu-24.04-gcc15-${{ matrix.build_type }}
          path: |
            compiler-version.txt
            ctest-exit.txt
            ctest-list.txt
            ctest.log
            ctest-results.xml
            ci-report.md
          if-no-files-found: warn

  test-clang18:
    name: ubuntu-24.04 Clang 18 Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja + SQLite (and select Clang 18)
        run: |
          # Image already ships ninja + libsqlite3-dev; install explicitly so a
          # thin image cannot fail cmake before ctest the way the GCC container
          # would without its apt step. Clang 18.1.3 ICEs at -O3 on connector
          # templates (job 99269558994, exit 139) — this cell is Debug, not Release.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev
          clang++-18 --version
          clang-tidy-18 --version | head -n 1
          ninja --version
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"

      - name: Configure, build, ctest
        run: bash .github/scripts/ci-build.sh Debug

      - name: Upload ctest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-ubuntu-24.04-clang18-Debug
          path: |
            compiler-version.txt
            ctest-exit.txt
            ctest-list.txt
            ctest.log
            ctest-results.xml
            ci-report.md
          if-no-files-found: warn

  test-msvc:
    name: windows-2022 MSVC Release
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install SQLite via vcpkg
        shell: bash
        run: |
          echo "VCPKG_INSTALLATION_ROOT=${VCPKG_INSTALLATION_ROOT}"
          "${VCPKG_INSTALLATION_ROOT}/vcpkg" install sqlite3:x64-windows
          toolchain="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
          toolchain="${toolchain//\\//}"
          vcpkg_bin="${VCPKG_INSTALLATION_ROOT}/installed/x64-windows/bin"
          vcpkg_bin="${vcpkg_bin//\\//}"
          echo "${vcpkg_bin}" >> "$GITHUB_PATH"
          echo "CMAKE_EXTRA_ARGS=-DCMAKE_TOOLCHAIN_FILE=${toolchain} -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL" >> "$GITHUB_ENV"

      - name: Configure, build, ctest
        shell: bash
        env:
          CC: cl
          CXX: cl
        run: bash .github/scripts/ci-build.sh Release

      - name: Upload ctest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-windows-2022-msvc-Release
          path: |
            compiler-version.txt
            ctest-exit.txt
            ctest-list.txt
            ctest.log
            ctest-results.xml
            ci-report.md
          if-no-files-found: warn
